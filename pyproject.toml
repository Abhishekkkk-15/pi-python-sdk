[project]
name = "pi-sdk"
version = "0.2.0"
description = "Headless Python coding-agent SDK (tools, providers, sessions) — no CLI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "PI" }]
keywords = ["agent", "coding", "llm", "sdk", "tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "python-dotenv>=1.0.0",
    "openai>=1.0.0",
    "tavily-python>=0.5.0",
    "tokenizers>=0.20.0",
    "google-genai>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/Abhishekkkk-15/pi-python-sdk"
Repository = "https://github.com/Abhishekkkk-15/pi-python-sdk"
Issues = "https://github.com/Abhishekkkk-15/pi-python-sdk/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "build>=1.0.0"]
mongodb = ["pymongo>=4.6"]

[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["pi_sdk*"]

[tool.setuptools.package-data]
pi_sdk = ["prompts/*.md"]
